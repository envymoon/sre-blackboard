# Postgres, a one-shot migration, the API (2 processes) and 2 workers.
# `--profile observability` adds Prometheus (:9091), Grafana (:3000) and Jaeger (:16686) for
# the system itself (M8, ADR-0011); export traces with SRE_OTEL_ENDPOINT=http://jaeger:4318.
# Needs SRE_JWT_SECRET (32+ characters) in the environment or in .env; see .env.example.
# The workers call the model through the Claude CLI: set CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`) or ANTHROPIC_API_KEY. Without either, investigations escalate.
x-app: &app
  build: {context: ., target: api}
  environment: &app-env
    SRE_DATABASE_URL: postgresql+psycopg://sre:sre@db:5432/sre
    SRE_JWT_SECRET: ${SRE_JWT_SECRET:?set SRE_JWT_SECRET (32+ characters) in .env}
    SRE_LLM_MODEL: ${SRE_LLM_MODEL:-claude-haiku-5-5}
    # Deployments remediation may touch (JSON list). The API, the workers and the executor
    # must agree: each of them puts plans to the policy. Default: none (fail closed).
    SRE_REMEDIATION_TARGETS: ${SRE_REMEDIATION_TARGETS:-[]}
    # Traces (M8): an OTLP/HTTP endpoint; empty, none are exported.
    SRE_OTEL_ENDPOINT: ${SRE_OTEL_ENDPOINT:-}
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre
      POSTGRES_DB: sre
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sre"]
      interval: 2s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 5

  worker:
    <<: *app
    build: {context: ., target: worker}
    environment:
      <<: *app-env
      SRE_LLM_BACKEND: ${SRE_LLM_BACKEND:-cli}
      SRE_AUTO_INVESTIGATE: ${SRE_AUTO_INVESTIGATE:-true}
      SRE_LLM_ROLE_MODELS: ${SRE_LLM_ROLE_MODELS:-{}}
      SRE_LLM_CONCURRENCY: ${SRE_LLM_CONCURRENCY:-2}
      SRE_LLM_EFFORT: ${SRE_LLM_EFFORT:-low}
      # Evaluation only (M7): tenant -> agent variant, e.g. {"lab-single": "single"}.
      SRE_EVAL_TENANT_VARIANTS: ${SRE_EVAL_TENANT_VARIANTS:-{}}
      # No value: passed through from the shell or .env when set, absent otherwise.
      CLAUDE_CODE_OAUTH_TOKEN:
      ANTHROPIC_API_KEY:
      SRE_ANTHROPIC_API_KEY:
    deploy:
      replicas: 2
    stop_grace_period: 30s
    depends_on:
      kb-ingest: {condition: service_completed_successfully}

  # The knowledge base (M6): kb/ chunked and embedded into Postgres for every tenant
  # (SRE_KB_TENANTS and the evaluation's tenants), once per start; unchanged documents are
  # skipped. The worker image carries the models, so nothing is downloaded here.
  kb-ingest:
    <<: *app
    build: {context: ., target: worker}
    command: ["python", "-m", "app.kb", "ingest", "--all-tenants", "--prune"]
    environment:
      <<: *app-env
      SRE_KB_TENANTS: ${SRE_KB_TENANTS:-["lab"]}
      SRE_EVAL_TENANT_VARIANTS: ${SRE_EVAL_TENANT_VARIANTS:-{}}
    restart: "no"
    depends_on:
      migrate: {condition: service_completed_successfully}

  # --- The system's own observability (M8): docker compose --profile observability up -d ---
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Histogram exemplars carry trace ids: Grafana links a slow point to its trace.
      - --enable-feature=exemplar-storage
    ports: ["9091:9090"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
    restart: unless-stopped

  jaeger:
    # 2.20: 2.21 dropped the /api/services and /api/traces query API that Grafana 13.2's Jaeger
    # data source still calls (only /api/v3 is left).
    image: jaegertracing/jaeger:2.20.0
    profiles: [observability]
    ports: ["16686:16686", "4318:4318"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sre-blackboard.json
      SRE_PROMETHEUS_QUERY_URL: http://prometheus:9090
      # The lab's Jaeger instead: http://sre-lab-control-plane:30080/jaeger/ui (on kind's network).
      SRE_JAEGER_QUERY_URL: ${SRE_JAEGER_QUERY_URL:-http://jaeger:16686}
    ports: ["3000:3000"]
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
