# M0: API only. M1 adds Postgres and the harness worker; M2 adds the kind-based demo cluster.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      SRE_LLM_MODEL: ${SRE_LLM_MODEL:-claude-haiku-5-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5
    restart: unless-stopped
