# The retrieval evaluation set (M6, ADR-0010): a query, and the sections that answer it.
#
# A result is a hit when its chunk holds one of the `relevant` sections ("<doc id>#<heading
# slug>"), so the labels do not depend on how documents are chunked. `relevant: []` marks a
# query the knowledge base cannot answer: the right result is nothing (the reranker's
# threshold should drop everything).
#
# Kinds:
#   exact       identifiers, error strings, metric or flag names copied from tool output
#   paraphrase  the same need in other words, sharing few terms with the answer
#   agent       what an investigator asks in the middle of an incident
#   negative    nothing in the knowledge base answers it
#
# Written before any retrieval was run on it, and not edited after looking at the results
# (a label fix would have to be justified by the text, and noted in the commit). Queries
# alternate between the dev split (odd ids: the threshold is chosen on these) and the
# test split (even ids: reported, never tuned on).

