id: ad-high-cpu
title: Ad burns CPU on every request
difficulty: medium
tags: [flag, saturation, leaf]
inject:
  - fault: ad-high-cpu
expect:
  root_cause: ad
  fault_type: saturation
  symptoms: [ad, frontend]
  repair: []
  acceptable:
    # More replicas spread the CPU load: a mitigation, not a fix.
    - {action: scale_deployment, deployment: ad}
notes: The latency comes from ad's own CPU; nothing it calls is slow.
