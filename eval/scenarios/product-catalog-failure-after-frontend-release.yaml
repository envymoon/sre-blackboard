id: product-catalog-failure-after-frontend-release
title: Product catalog fails right after a harmless frontend release
difficulty: hard
tags: [flag, error, distractor, red-herring-release]
inject:
  - fault: benign-release-frontend
    role: distractor
  - fault: product-catalog-failure
    after_s: 90
expect:
  root_cause: product-catalog
  fault_type: error
  symptoms: [product-catalog, frontend, checkout, recommendation, frontend-proxy]
  repair: []
notes: >
  frontend is where the errors show and it was just released. product-catalog's own
  server spans fail for one product id, which a frontend change could not cause.
