id: recommendation-bad-release
title: A recommendation release points its catalog client at a dead port
difficulty: medium
tags: [release, error, repairable, healthy-dependency]
inject:
  - fault: recommendation-bad-release
expect:
  root_cause: recommendation
  fault_type: bad-deploy
  symptoms: [recommendation, frontend]
  repair:
    - {action: rollout_undo, deployment: recommendation}
notes: >
  recommendation cannot reach product-catalog; product-catalog is healthy (frontend still
  calls it directly without errors).
