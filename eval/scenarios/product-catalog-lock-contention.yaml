id: product-catalog-lock-contention
title: Product catalog queries wait on a database lock
difficulty: medium
tags: [flag, latency, database]
inject:
  - fault: product-catalog-lock-contention
expect:
  root_cause: product-catalog
  fault_type: latency
  symptoms: [product-catalog, frontend, recommendation, checkout]
  repair: []
notes: >
  product-catalog's code holds a lock around its queries; its database is fine. Blaming the
  database (astronomy-db in the client spans) is the near miss: the wait is in the service.
