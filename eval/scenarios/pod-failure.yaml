id: pod-failure
title: Every cart pod stops serving
difficulty: hard
tags: [chaos, unavailable]
inject:
  - fault: pod-failure
expect:
  root_cause: cart
  fault_type: unavailable
  symptoms: [frontend, checkout, frontend-proxy]
  repair: []
notes: >
  Chaos Mesh replaces cart's container with a pause image: the pod is Running, but nothing
