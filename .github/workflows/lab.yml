name: Fault lab

# The M2 lab on a GitHub-hosted runner (4 vCPU, 16 GB for public repositories): a fresh kind
# cluster with the OpenTelemetry Demo, the sre-blackboard stack from docker compose, and the
# acceptance run (inject -> alert within 5 min -> recover -> resolved). Nothing is reused
# between runs, so every run also proves `make env-up` works from scratch.
#
# Since M3 the acceptance run also calls the read-only tools during each fault, checks what
# they return, and records the answers. The recordings are pushed to a branch
# lab-recordings/run-<id>, because the cloud dev container can read git but not artifacts.
#
# Since M4 the compose workers investigate every incident with the real model (claude -p on
# the subscription, authenticated by the CLAUDE_CODE_OAUTH_TOKEN secret), and the acceptance
# run waits for each fault's diagnosis and scores it. Without the secret the agents are
# skipped and the run says so. Each fault's investigations are exported as recordings too.

on:
  workflow_dispatch:
    inputs:
      faults:
        description: "Faults to run, space separated (empty: the acceptance set)"
        required: false
        default: ""
  push:
    branches: ["milestone/**"]
    paths:
      - "deploy/kind/**"
      - "scripts/lab/**"
      - "app/tools/**"
      - "app/agents/**"
      - "app/llm/**"
      - "app/worker/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/lab.yml"

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    # Pinned: ubuntu-latest moves to a new release, and the lab should only change on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write  # only to push the recordings branch
    env:
      SRE_DATABASE_URL: postgresql+psycopg://sre:sre@localhost:5432/sre
      # Empty when the secret is not set; exported to compose only when it is (see below).
      LAB_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' deploy/kind/versions.env >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Install kind and helm
        run: |
          curl -sSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install /tmp/kind /usr/local/bin/kind
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          kind version && helm version --short && kubectl version --client

      - name: Start sre-blackboard
        run: |
          echo "SRE_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > .env
          docker compose up --build -d
          timeout 120 bash -c 'until curl -fsS localhost:8000/readyz; do sleep 2; done'

      - name: Create the lab
        run: |
          mkdir -p lab-out
          set -o pipefail
          ./deploy/kind/up.sh 2>&1 | tee lab-out/up.log

      - name: Tool settings
        run: |
          # Endpoints and a short-lived read-only Kubernetes token. Not in lab-out: that is uploaded.
          uv run python -m scripts.lab env > .lab.env
          grep -v TOKEN .lab.env

      - name: Point the workers at the lab
        run: |
          # The workers join kind's Docker network and investigate the lab from there.
          uv run python -m scripts.lab env --internal > .lab.worker.env
          if [ -n "$LAB_CLAUDE_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$LAB_CLAUDE_TOKEN"; fi
          docker compose -f docker-compose.yml -f deploy/kind/compose.lab.yml up -d --no-deps worker
          sleep 5
          {
            echo "# claude in the worker image"
            docker compose exec -T worker claude --version
            echo "# a tool call from inside a worker container (Prometheus over kind's network)"
            docker compose exec -T worker python -m app.tools call prom_query '{"query": "count(up)"}'
            echo "# Kubernetes API with the reader token"
            docker compose exec -T worker python -m app.tools call rollout_history '{"deployment": "checkout"}' | head -c 600
          } 2>&1 | tee lab-out/worker-check.txt
          if [ -z "$LAB_CLAUDE_TOKEN" ]; then
            echo "::warning title=agents::CLAUDE_CODE_OAUTH_TOKEN is not set; the acceptance run skips the agents"
          fi

      - name: Wait for span metrics
        run: |
          # Every service needs a few minutes of traffic before the 5m SLI windows mean anything.
          for i in $(seq 1 60); do
            n=$(curl -fsS 'localhost:19090/api/v1/query' --data-urlencode 'query=count(service:sli_requests:rate5m > 0)' \
                | jq -r '.data.result[0].value[1] // 0')
            echo "services with traffic: $n"
            [ "$n" -ge 8 ] && break
            sleep 15
          done
          sleep 240

      - name: Baseline
        run: |
          mkdir -p lab-out
          uv run python -m scripts.lab probe | tee lab-out/baseline-slis.txt
          uv run python -m scripts.lab status | tee lab-out/baseline-status.txt
          curl -fsS localhost:19090/api/v1/label/__name__/values | jq -r '.data[]' > lab-out/metric-names.txt
          curl -fsS 'localhost:19090/api/v1/series' --data-urlencode 'match[]=traces_span_metrics_calls_total' \
            | jq -c '.data[:40][]' > lab-out/span-metric-series.jsonl
          curl -fsSG localhost:13100/loki/api/v1/labels | jq -c . > lab-out/loki-labels.json
          # Where the baseline errors come from (frontend sat near the slow-burn threshold in run 5).
          {
            echo "# error spans/s by service, kind, span (5m)"
            curl -fsS 'localhost:19090/api/v1/query' --data-urlencode 'query=sort_desc(sum by (service_name, span_kind, span_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m])) > 0)' \
              | jq -r '.data.result[] | [.metric.service_name, .metric.span_kind, .metric.span_name, (.value[1] | tonumber * 1000 | round / 1000)] | @tsv'
            echo "# frontend server spans/s by span and status (5m)"
            curl -fsS 'localhost:19090/api/v1/query' --data-urlencode 'query=sort_desc(sum by (span_name, status_code) (rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER"}[5m])) > 0)' \
              | jq -r '.data.result[] | [.metric.span_name, .metric.status_code, (.value[1] | tonumber * 1000 | round / 1000)] | @tsv'
          } > lab-out/baseline-errors.txt 2>&1 || true
          # The log line is only the message; the error details are in structured metadata.
          curl -fsSG -H 'X-Loki-Response-Encoding-Flags: categorize-labels' localhost:13100/loki/api/v1/query_range \
              --data-urlencode 'query={service_name="frontend"} |~ "(?i)(error|fail|exception)"' --data-urlencode limit=30 \
              | jq -c '.data.result[].values[] | [.[1], (.[2].structuredMetadata // {} | with_entries(select(.key | test("err|code|status|message|path"))))]' \
              | cut -c1-600 > lab-out/frontend-error-logs.txt 2>&1 || true
          # Error spans from Jaeger, grouped: service, operation, status/peer tags, exception message.
          curl -fsSG localhost:18080/jaeger/ui/api/traces --data-urlencode service=frontend --data-urlencode 'tags={"error":"true"}' \
              --data-urlencode limit=200 --data-urlencode lookback=1h \
            | jq -r '.data[] | . as $t | .spans[] | select(any(.tags[]; .key == "error" and .value == true))
                | [$t.processes[.processID].serviceName, .operationName,
                   ([.tags[] | select(.key | test("status|grpc|error.type|peer|server.address")) | "\(.key)=\(.value)"] | join(" ")),
                   ([.logs[]?.fields[]? | select(.key | test("exception.message|exception.type")) | "\(.value)"] | join(" | "))] | @tsv' \
            | cut -c1-400 | sort | uniq -c | sort -rn > lab-out/error-traces.txt 2>&1 || true
          wc -l lab-out/*.txt

      - name: Resource usage
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' | tee lab-out/docker-stats.txt
          free -m | tee -a lab-out/docker-stats.txt
          docker exec sre-lab-control-plane sh -c 'cat /sys/fs/cgroup/memory.current' | awk '{printf "kind node cgroup memory (includes page cache): %.0f MiB\n", $1/1048576}' | tee -a lab-out/docker-stats.txt
          # Per container working set inside the node, largest first.
          # Informational only: never fail the step (it would skip the acceptance run).
          { docker exec sre-lab-control-plane crictl stats -o json \
              | jq -r '.stats[] | [.attributes.labels["io.kubernetes.pod.namespace"], .attributes.labels["io.kubernetes.container.name"], ((.memory.workingSetBytes.value // "0") | tonumber / 1048576 | floor)] | @tsv' \
              | sort -t$'\t' -k3 -rn | awk -F'\t' '{printf "%-12s %-28s %6d MiB\n", $1, $2, $3}' | tee lab-out/container-memory.txt; } || true

      - name: Acceptance
        run: |
          set -o pipefail
          agents=()
          if [ -n "$LAB_CLAUDE_TOKEN" ]; then agents=(--diagnose --record-agents lab-out/agent); fi
          uv run python -m scripts.lab accept ${{ inputs.faults }} --report lab-out/report.json \
            --probe-dir lab-out/cassettes "${agents[@]}" | tee lab-out/accept.txt

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p lab-out
          ctx=(--context kind-sre-lab)
          kubectl "${ctx[@]}" get pods -A -o wide > lab-out/pods.txt 2>&1 || true
          kubectl "${ctx[@]}" -n otel-demo get events --sort-by=.lastTimestamp > lab-out/events.txt 2>&1 || true
          kubectl "${ctx[@]}" -n otel-demo logs statefulset/otel-demo-alertmanager --tail=300 > lab-out/alertmanager.log 2>&1 || true
          kubectl "${ctx[@]}" -n otel-demo logs deployment/prometheus -c prometheus-server --tail=300 > lab-out/prometheus.log 2>&1 || true
          curl -fsS localhost:19090/api/v1/rules | jq . > lab-out/rules.json 2>&1 || true
          curl -fsS localhost:19090/api/v1/alerts | jq . > lab-out/alerts.json 2>&1 || true
          docker compose logs --no-color --tail=500 api > lab-out/sre-blackboard.log 2>&1 || true
          docker compose logs --no-color worker > lab-out/worker.log 2>&1 || true
          grep -E "WARNING|ERROR|incident .*: |failed" lab-out/worker.log | tail -200 > lab-out/worker-events.txt || true
          cat lab-out/pods.txt || true

      # Readable through the REST API even where logs and artifacts are not (see the script).
      # GitHub keeps 10 notices per step, so the output is spread over three steps.
      - name: Publish results as annotations
        if: always()
        run: |
          uv run python -m scripts.lab.annotate lab-out/accept.txt:200 lab-out/worker-check.txt:40 \
            lab-out/baseline-slis.txt lab-out/docker-stats.txt lab-out/container-memory.txt lab-out/up.log:40
      - name: Publish cluster state as annotations
        if: always()
        run: |
          uv run python -m scripts.lab.annotate lab-out/error-traces.txt:50 lab-out/frontend-error-logs.txt:30 \
            lab-out/baseline-errors.txt:40 lab-out/pods.txt:40
      - name: Publish logs as annotations
        if: always()
        run: |
          uv run python -m scripts.lab.annotate lab-out/worker-events.txt:120 lab-out/sre-blackboard.log:60 \
            lab-out/alertmanager.log:40 lab-out/prometheus.log:20

      - name: Push recordings
        if: always() && (hashFiles('lab-out/cassettes/*.jsonl.gz') != '' || hashFiles('lab-out/agent/**') != '')
        run: |
          branch="lab-recordings/run-${{ github.run_id }}"
          keep=$(mktemp -d)
          cp -r lab-out/cassettes lab-out/agent lab-out/accept.txt lab-out/report.json "$keep"/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$branch"
          cp -r "$keep"/. .
          # Only these: untracked leftovers (lab-out/, ignored settings files) stay out.
          for f in cassettes agent accept.txt report.json; do [ -e "$f" ] && git add "$f"; done
          git commit -q -m "lab recordings from run ${{ github.run_id }} (${{ github.sha }})"
          git push -q origin "$branch"
          echo "::notice title=recordings::pushed to $branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-out
          path: lab-out/
          retention-days: 14
