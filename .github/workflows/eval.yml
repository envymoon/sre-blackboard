name: Evaluation

# M7 (ADR-0009): the labelled scenarios in eval/scenarios on the fault lab, with the real
# model, every agent variant side by side. The scenarios are split over parallel jobs
# (shards); each builds its own lab from scratch (.github/actions/lab-up) and runs its share
# with `python -m scripts.lab eval`. A last job merges the shards' observations into one
# result file, scores it, applies the release gate (app/eval/gate.py) and pushes the result
# and every recording to lab-recordings/eval-<run id>.
#
# Expensive (a few hours of runners, real model use on the subscription), so never on a
# plain push: dispatch it, or push a commit whose message contains "[eval]", optionally with
# settings, e.g. "[eval scenarios=bad-release,network-delay variants= shards=1]" (empty
# variants: the default agents only; alert_timeout=900 waits longer for every first alert
# than the scenarios' own timeouts). Dispatch needs this file on the default branch.

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenario ids, comma separated (empty: all)"
        required: false
        default: ""
      variants:
        description: "Agent variants beside the default, space separated"
        required: false
        default: "single strong-plan canary"
      shards:
        description: "Parallel lab jobs"
        required: false
        default: "4"
      alert_timeout:
        description: "Seconds to wait for a scenario's first alert, at least"
        required: false
        default: "300"
  push:
    branches: ["milestone/**"]

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[eval')
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      variants: ${{ steps.plan.outputs.variants }}
      alert_timeout: ${{ steps.plan.outputs.alert_timeout }}
    steps:
      - id: plan
        env:
          # Through the environment, never pasted into the script: the message is user input.
          MESSAGE: ${{ github.event.head_commit.message }}
          IN_SCENARIOS: ${{ inputs.scenarios }}
          IN_VARIANTS: ${{ inputs.variants }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_ALERT_TIMEOUT: ${{ inputs.alert_timeout }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          settings = {"scenarios": "", "variants": "single strong-plan canary", "shards": "4", "alert_timeout": "300"}
          if os.environ["EVENT"] == "workflow_dispatch":
              settings |= {"scenarios": os.environ["IN_SCENARIOS"], "variants": os.environ["IN_VARIANTS"],
                           "shards": os.environ["IN_SHARDS"], "alert_timeout": os.environ["IN_ALERT_TIMEOUT"]}
          else:
              m = re.search(r"\[eval([^\]]*)\]", os.environ["MESSAGE"])
              for key, value in re.findall(r"(\w+)=([^\s\]]*)", m.group(1) if m else ""):
                  if key in settings:
                      settings[key] = value.replace(",", " ") if key == "variants" else value
          names = [n for n in re.split(r"[,\s]+", settings["scenarios"]) if re.fullmatch(r"[a-z0-9-]+", n)]
          variants = [v for v in settings["variants"].split() if re.fullmatch(r"[a-z0-9-]+", v)]
          n = max(1, min(8, int(settings["shards"] or 1)))
          if names:
              n = min(n, len(names))
          print(f"shards={json.dumps(list(range(1, n + 1)))}")
          print(f"count={n}")
          print(f"scenarios={' '.join(names)}")
          print(f"variants={' '.join(variants)}")
          print(f"alert_timeout={max(60, min(1800, int(settings['alert_timeout']) if settings['alert_timeout'].isdigit() else 300))}")
          PY
          cat "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SRE_DATABASE_URL: postgresql+psycopg://sre:sre@localhost:5432/sre
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: ./.github/actions/lab-up
        with:
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          variants: ${{ needs.plan.outputs.variants }}
          # One more worker per variant beyond the first: every alert is investigated once per tenant.
          workers: "3"

      - name: Scenarios
        env:
          SCENARIOS: ${{ needs.plan.outputs.scenarios }}
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
          ALERT_TIMEOUT: ${{ needs.plan.outputs.alert_timeout }}
        run: |
          set -o pipefail
          if [ ! -f lab-out/agents.enabled ]; then
            echo "::error title=eval::the workers cannot reach the model: $(cat lab-out/agents.txt)"; exit 1
          fi
          # Named scenarios are dealt out over the shards like the whole catalogue would be.
          picked=()
          if [ -n "$SCENARIOS" ]; then
            read -ra all <<< "$SCENARIOS"
            i=${SHARD%/*}; n=${SHARD#*/}
            for k in "${!all[@]}"; do [ $((k % n)) -eq $((i - 1)) ] && picked+=("${all[$k]}"); done
            shard_args=("${picked[@]}")
          else
            shard_args=(--shard "$SHARD")
          fi
          uv run python -m scripts.lab eval "${shard_args[@]}" --out lab-out/eval --run "${{ github.run_id }}" \
            --alert-timeout "$ALERT_TIMEOUT" 2>&1 | tee lab-out/eval.txt
          uv run python -m app.eval report lab-out/eval/results.json --baseline "" --gate --canary \
            | tee lab-out/eval/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p lab-out
          kubectl --context kind-sre-lab get pods -A -o wide > lab-out/pods.txt 2>&1 || true
          kubectl --context kind-sre-lab -n otel-demo get events --sort-by=.lastTimestamp > lab-out/events.txt 2>&1 || true
          docker compose logs --no-color --tail=500 api > lab-out/sre-blackboard.log 2>&1 || true
          docker compose logs --no-color worker > lab-out/worker.log 2>&1 || true
          grep -E "WARNING|ERROR|incident .*: |failed" lab-out/worker.log | tail -200 > lab-out/worker-events.txt || true
          docker compose -f docker-compose.yml -f deploy/kind/compose.lab.yml logs --no-color executor > lab-out/executor.log 2>&1 || true

      # Readable through the REST API even where logs and artifacts are not (scripts/lab/annotate.py).
      - name: Publish results as annotations
        if: always()
        run: |
          grep -E "^=== |answer:|plan for|execution|\[baseline\]|error|not resolved|no alert|peak SLIs" lab-out/eval.txt \
            > lab-out/eval-events.txt 2>/dev/null || true
          uv run python -m scripts.lab.annotate lab-out/eval-events.txt:250 lab-out/worker-check.txt:40
      - name: Publish logs as annotations
        if: always()
        run: uv run python -m scripts.lab.annotate lab-out/worker-events.txt:120 lab-out/pods.txt:40

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: eval-shard-${{ matrix.shard }}
          # Recordings, observations and logs; never the settings files (tokens).
          path: |
            lab-out/eval/
            lab-out/eval.txt
            lab-out/worker-events.txt
          retention-days: 14

  results:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # only to push the results branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-shard-*
          path: shards

      - name: Merge, score and gate
        id: gate
        run: |
          set -o pipefail
          mkdir -p out/agent
          files=(shards/*/eval/results.json)
          uv run python -m app.eval merge "out/run-${{ github.run_id }}.json" --run "${{ github.run_id }}" \
            --commit "${{ github.sha }}" "${files[@]}"
          for d in shards/*/eval/agent; do cp -r "$d"/. out/agent/; done
          status=0
          uv run python -m app.eval report "out/run-${{ github.run_id }}.json" --json out/metrics.json \
            > out/report.md || status=$?
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          grep -E '^- \*\*' out/report.md | sed 's/^/::notice title=gate::/' || true
          grep -E '^\| (Top-1|Top-3|per incident|actions right|safety violations|escalated|\$ / incident) ' out/report.md \
            | sed 's/^/::notice title=metrics::/' || true
          grep -E '^(evaluation void|no results)' out/report.md | sed 's/^/::error title=gate::/' || true
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Push results
        if: always()
        run: |
          branch="lab-recordings/eval-${{ github.run_id }}"
          keep=$(mktemp -d)
          cp -r out/. "$keep"/
          for i in shards/*; do cp "$i/eval.txt" "$keep/$(basename "$i").txt" 2>/dev/null || true; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$branch"
          cp -r "$keep"/. .
          # Only these: the checkout's untracked leftovers (shards/, .venv) stay out.
          for f in run-*.json metrics.json report.md agent eval-shard-*.txt; do [ -e "$f" ] && git add "$f"; done
          git commit -q -m "evaluation results from run ${{ github.run_id }} (${{ github.sha }})"
          git push -q origin "$branch"
          echo "::notice title=results::pushed to $branch"

      - name: Gate
        env:
          STATUS: ${{ steps.gate.outputs.status }}
        run: exit "${STATUS:-1}"
