name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Alert rule tests
        run: make rules-test
      - name: Shell scripts
        run: shellcheck -x -P SCRIPTDIR deploy/kind/*.sh

  # M1 acceptance on every PR: the real image built from the Dockerfile, the whole
  # compose stack (2 API processes, 2 workers), and the duplicate-alert load test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Start the stack
        run: |
          echo "SRE_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > .env
          docker compose up --build -d
          timeout 120 bash -c 'until curl -fsS localhost:8000/readyz; do sleep 2; done'
      - name: Load test
        run: |
          set -a; . ./.env; set +a
          uv run python -m scripts.loadtest --alerts 2000 --distinct 200
        env:
          SRE_DATABASE_URL: postgresql+psycopg://sre:sre@localhost:5432/sre
      - name: Stop gracefully
        run: timeout 60 docker compose down
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
