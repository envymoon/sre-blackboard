name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Alert rule tests
        # On failure promtool's output becomes one annotation: readable without the job log.
        run: |
          make rules-test > rules-test.log 2>&1 && exit 0
          cat rules-test.log
          echo "::error title=promtool::$(tail -60 rules-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          exit 1
      - name: Shell scripts
        run: shellcheck -x -P SCRIPTDIR deploy/kind/*.sh

  # The console (M9): types, unit tests, formatting, the production build and the first-screen
  # JavaScript budget (200 KB gzip per landing route).
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Build the static site
        run: npm run build
        env:
          VITE_SITE: pages
      - run: npm run budget

  # The retrieval evaluation (M6, ADR-0010) with the real local models: bge-small for
  # embeddings, a MiniLM cross-encoder for reranking, both on the CPU (no model API, no
  # subscription use). It recomputes eval/retrieval/report.json and fails when the committed
  # report no longer reproduces. The weights (~200 MB) are cached between runs.
  retrieval:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sre
          POSTGRES_PASSWORD: sre
          POSTGRES_DB: sre
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sre" --health-interval 2s --health-retries 30
    env:
      SRE_DATABASE_URL: postgresql+psycopg://sre:sre@localhost:5432/sre
      SRE_KB_MODEL_DIR: ${{ github.workspace }}/.kb-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - uses: actions/cache@v4
        with:
          path: .kb-models
          key: kb-models-${{ hashFiles('app/kb/models.py', 'uv.lock') }}
      - name: Download the models
        run: uv run python -m app.kb models
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Evaluate
        run: uv run python -m app.kb eval --check --annotate

  # M1 acceptance on every PR: the real image built from the Dockerfile, the whole
  # compose stack (2 API processes, 2 workers), and the duplicate-alert load test.
  # M8 on the same stack: its own Prometheus, Grafana and Jaeger (--profile observability),
  # the metrics adding up, every alert and dashboard query evaluating, and traces in Jaeger,
  # including a recorded investigation replayed into it. No model is called.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Start the stack
        run: |
          echo "SRE_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > .env
          # The load test is about ingest and the queue; investigations need a model (lab only).
          echo "SRE_AUTO_INVESTIGATE=false" >> .env
          echo "SRE_OTEL_ENDPOINT=http://jaeger:4318" >> .env
          docker compose --profile observability up --build -d
          timeout 120 bash -c 'until curl -fsS localhost:8000/readyz; do sleep 2; done'
      - name: Load test
        run: |
          set -a; . ./.env; set +a
          uv run python -m scripts.loadtest --alerts 2000 --distinct 200
        env:
          SRE_DATABASE_URL: postgresql+psycopg://sre:sre@localhost:5432/sre
      - name: Observability
        run: |
          # An empty database for the replayed investigation, next to the load test's.
          docker compose exec -T db psql -U sre -c "CREATE DATABASE replay"
          SRE_DATABASE_URL=postgresql+psycopg://sre:sre@localhost:5432/replay uv run alembic upgrade head
          uv run python -m scripts.obs_check --replay postgresql+psycopg://sre:sre@localhost:5432/replay
      - name: Stop gracefully
        run: timeout 60 docker compose --profile observability down
      - name: Logs
        if: failure()
        run: docker compose --profile observability logs --no-color
