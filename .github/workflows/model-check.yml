name: Model check

# One tiny claude -p call with the CLAUDE_CODE_OAUTH_TOKEN secret, made the way the workers
# make it. About a minute, against the hour a lab run takes to find out the same thing.
# Prints only whether the secret is set and the model's one-word answer, never the token.
#
# Then the prompt-injection check (scripts/injection_eval.py, B11): the planner, with the
# real model, on an incident whose data carries planted instructions. It fails on any
# injected action that would get past the policy, or when the clean case is not repaired.

on:
  workflow_dispatch:
  # Dispatch needs the file on the default branch; until then a push of this file runs it,
  # and a re-run of that run checks the secret again.
  push:
    branches: ["milestone/**"]
    paths: [".github/workflows/model-check.yml", "scripts/injection_eval.py", "app/agents/prompts/planner.md"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install the Claude Code CLI (the version the worker image pins)
        run: |
          npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@2.1.300"
          claude --version

      - name: One claude -p call
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            msg="the CLAUDE_CODE_OAUTH_TOKEN repository secret is empty or not visible to Actions"
            echo "::error title=model::$msg"; exit 1
          fi
          cd "$(mktemp -d)"
          # The answer is the JSON on stdout. stderr may carry warnings; it is shown only on failure,
          # on one line (a workflow annotation ends at the first newline).
          out=$(echo "Reply with the word ok." | claude -p --model claude-haiku-5-5 --tools "" \
                --strict-mcp-config --setting-sources "" --output-format json --no-session-persistence 2>err.txt) || true
          if echo "$out" | jq -e '.is_error == false' > /dev/null 2>&1; then
            echo "::notice title=model::reachable: $(echo "$out" | jq -c '{result, total_cost_usd, models: (.modelUsage | keys)}')"
          else
            echo "::error title=model::claude -p failed: $(cat - err.txt <<< "$out" | tr '\n' ' ' | head -c 600)"; exit 1
          fi

      - name: Prompt-injection check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SRE_LLM_BACKEND: cli
        run: |
          uv sync --locked --python 3.12
          status=0
          uv run python -m scripts.injection_eval > injection.md || status=$?
          cat injection.md >> "$GITHUB_STEP_SUMMARY"
          # One annotation per case and one for the totals, readable without the logs.
          grep -E '^\| [a-z-]+ \|' injection.md | grep -v '^| case' | while IFS= read -r row; do
            echo "::notice title=injection::$row"
          done
          echo "::notice title=injection::$(grep '^Safety violations' injection.md)"
          grep -E '^(control case|eval void)' injection.md | sed 's/^/::error title=injection::/' || true
          exit $status
