name: Lab up
description: >
  The sre-blackboard stack from docker compose, a fresh kind cluster with the OpenTelemetry
  Demo (deploy/kind/up.sh), the workers and the executor pointed at it, and a check that the
  workers can reach the model. Shared by the acceptance run (lab.yml) and the evaluation
  (eval.yml). Run actions/checkout first.

inputs:
  claude-token:
    description: "The CLAUDE_CODE_OAUTH_TOKEN secret (empty: the agents are skipped)"
    required: false
    default: ""
  variants:
    description: >
      Agent variants to run beside the default, space separated (M7, app/agents/variants.py).
      Each gets its own tenant, lab-<variant>, which Alertmanager also posts every alert to.
    required: false
    default: ""
  workers:
    description: Worker containers
    required: false
    default: "2"

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /

    - name: Load pinned versions
      shell: bash
      run: grep -E '^[A-Z_]+=' deploy/kind/versions.env >> "$GITHUB_ENV"

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      with:
        version: "0.11.32"
        enable-cache: true
    - name: Install dependencies
      shell: bash
      run: uv sync --locked --python 3.12

    - name: Install kind and helm
      shell: bash
      run: |
        curl -sSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
        sudo install /tmp/kind /usr/local/bin/kind
        curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
        sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
        kind version && helm version --short && kubectl version --client

    - name: Start sre-blackboard
      shell: bash
      env:
        VARIANTS: ${{ inputs.variants }}
      run: |
        echo "SRE_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > .env
        # The Deployments remediation may touch (M5). The API, workers and executor all read it.
        echo "SRE_REMEDIATION_TARGETS='[\"checkout\",\"payment\",\"product-catalog\",\"recommendation\",\"frontend\",\"cart\",\"currency\",\"shipping\",\"ad\",\"email\",\"quote\"]'" >> .env
        # Tenant -> agent variant for the workers and the evaluation runner (M7).
        echo "SRE_EVAL_TENANT_VARIANTS='$(python3 -c 'import json, sys; print(json.dumps({f"lab-{v}": v for v in sys.argv[1:]}))' $VARIANTS)'" >> .env
        grep -v JWT .env
        docker compose up --build -d
        timeout 120 bash -c 'until curl -fsS localhost:8000/readyz; do sleep 2; done'

    - name: Create the lab
      shell: bash
      env:
        SRE_LAB_VARIANTS: ${{ inputs.variants }}
      run: |
        mkdir -p lab-out
        set -o pipefail
        ./deploy/kind/up.sh 2>&1 | tee lab-out/up.log

    - name: Tool settings
      shell: bash
      run: |
        # Endpoints and a short-lived read-only Kubernetes token. Not in lab-out: that is uploaded.
        uv run python -m scripts.lab env > .lab.env
        grep -v TOKEN .lab.env

    - name: Point the workers at the lab
      shell: bash
      env:
        # The model token is visible to this step only, and from here only to the worker
        # containers' environment: never written to a file, a log or lab-out. Empty when the
        # secret is not set. Its scope is model requests on the subscription (one year).
        LAB_CLAUDE_TOKEN: ${{ inputs.claude-token }}
        WORKERS: ${{ inputs.workers }}
      run: |
        # The workers join kind's Docker network and investigate the lab from there.
        uv run python -m scripts.lab env --internal > .lab.worker.env
        # The executor gets its own token and nothing else (M5); the workers never see it.
        uv run python -m scripts.lab env --internal --executor > .lab.executor.env
        if [ -n "$LAB_CLAUDE_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$LAB_CLAUDE_TOKEN"; fi
        # The executor's environment has no model token: the override does not pass it through.
        # The API too: it joins kind's network to send its spans to the demo's Jaeger (M8).
        docker compose -f docker-compose.yml -f deploy/kind/compose.lab.yml up -d --no-deps \
          --scale worker="$WORKERS" worker executor api
        timeout 60 bash -c 'until curl -fsS localhost:8000/readyz >/dev/null; do sleep 2; done'
        sleep 5
        {
          echo "# claude in the worker image"
          docker compose exec -T worker claude --version
          echo "# a tool call from inside a worker container (Prometheus over kind's network)"
          docker compose exec -T worker python -m app.tools call prom_query '{"query": "count(up)"}'
          echo "# Kubernetes API with the reader token"
          docker compose exec -T worker python -m app.tools call rollout_history '{"deployment": "checkout"}' | head -c 600
          echo
          echo "# who may do what (kubectl auth can-i), in otel-demo"
          for sa in sre-blackboard-reader sre-blackboard-executor; do
            for verb in "get deployments" "patch deployments" "delete deployments" "create pods/exec" "get secrets"; do
              echo "$sa: $verb: $(kubectl --context kind-sre-lab -n otel-demo auth can-i $verb \
                --as=system:serviceaccount:otel-demo:$sa 2>/dev/null || true)"
            done
          done
          echo "# the executor process"
          lab=(-f docker-compose.yml -f deploy/kind/compose.lab.yml)
          docker compose "${lab[@]}" ps executor --format '{{.Name}} {{.State}}'
          docker compose "${lab[@]}" exec -T executor sh -c 'test -z "$CLAUDE_CODE_OAUTH_TOKEN" && test -z "$SRE_K8S_TOKEN" && echo "no model token, no reader token"'
          echo "# workers and their agent variants"
          docker compose ps worker --format '{{.Name}} {{.State}}'
          docker compose exec -T worker sh -c 'echo "SRE_EVAL_TENANT_VARIANTS=$SRE_EVAL_TENANT_VARIANTS"'
        } 2>&1 | tee lab-out/worker-check.txt
        # Can the workers reach the model? One tiny claude -p call, as the backend makes it.
        # Lab run 13 had no token: every investigation escalated with "Not logged in".
        if [ -z "$LAB_CLAUDE_TOKEN" ]; then
          echo "[agents] skipped: the CLAUDE_CODE_OAUTH_TOKEN secret is not set" | tee lab-out/agents.txt
        # The JSON answer is on stdout; the CLI may print warnings on stderr, which the backend
        # reads only to explain a failure. So the same here.
        elif out=$(echo "Reply with the word ok." | docker compose exec -T worker sh -c 'cd /tmp && claude -p \
              --model claude-haiku-5-5 --tools "" --strict-mcp-config --setting-sources "" \
              --output-format json --no-session-persistence' 2>/tmp/claude-check.err) \
             && echo "$out" | jq -e '.is_error == false' > /dev/null; then
          echo "[agents] model reachable: $(echo "$out" | jq -c '{result, total_cost_usd}')" | tee lab-out/agents.txt
          echo "enabled" > lab-out/agents.enabled
        else
          why=$(cat - /tmp/claude-check.err <<< "$out" | tr '\n' ' ' | head -c 400)
          echo "[agents] skipped: claude -p in the worker failed: $why" | tee lab-out/agents.txt
        fi
        echo "::notice title=agents::$(cat lab-out/agents.txt)"

    - name: Wait for span metrics
      shell: bash
      run: |
        # Every service needs a few minutes of traffic before the 5m SLI windows mean anything.
        for i in $(seq 1 60); do
          n=$(curl -fsS 'localhost:19090/api/v1/query' --data-urlencode 'query=count(service:sli_requests:rate5m > 0)' \
              | jq -r '.data.result[0].value[1] // 0')
          echo "services with traffic: $n"
          [ "$n" -ge 8 ] && break
          sleep 15
        done
        sleep 240
