# Single-node kind cluster for the fault lab.
# Host ports are bound to 127.0.0.1 and chosen to avoid the usual 8080/9090 clashes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 18080, listenAddress: 127.0.0.1}  # demo shop, /jaeger/ui, /feature
      - {containerPort: 30090, hostPort: 19090, listenAddress: 127.0.0.1}  # Prometheus
      - {containerPort: 30093, hostPort: 19093, listenAddress: 127.0.0.1}  # Alertmanager
      - {containerPort: 30100, hostPort: 13100, listenAddress: 127.0.0.1}  # Loki
