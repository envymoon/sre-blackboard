# The workers investigate the lab: they join kind's Docker network and call Prometheus, Loki,
# Jaeger, flagd and the Kubernetes API on the node, as a pod would. After `make env-up`:
#
#   uv run python -m scripts.lab env --internal > .lab.worker.env
#   docker compose -f docker-compose.yml -f deploy/kind/compose.lab.yml up -d worker
#
# (`make lab-workers` does both.) .lab.worker.env holds a short-lived read-only token; it is
# git-ignored. The CA certificate is the one `scripts.lab env` wrote to .lab-ca.crt.
#
# The executor (M5, ADR-0007) is a separate container with a separate token, the only one
# allowed to patch Deployments: `uv run python -m scripts.lab env --internal --executor >
# .lab.executor.env`, then `up -d executor`. It has no model and no read tools; the workers
# never see its token.
#
# Traces (M8, ADR-0011): the API, the workers and the executor export to the demo's Jaeger
# (deploy/kind/manifests/jaeger-otlp.yaml), so the incident trees are in the same Jaeger UI as
# the shop's own traces: http://localhost:18080/jaeger/ui, service sre-blackboard-*.
x-traces: &traces
  SRE_OTEL_ENDPOINT: http://sre-lab-control-plane:30318

services:
  api:
    networks: [default, kind]
    environment:
      <<: *traces

  worker:
    networks: [default, kind]
    env_file: [.lab.worker.env]
    environment:
      <<: *traces
    volumes:
      - ./.lab-ca.crt:/run/lab/ca.crt:ro

  executor:
    build: {context: ., target: api}
    command: ["python", "-m", "app.executor"]
    environment:
      SRE_DATABASE_URL: postgresql+psycopg://sre:sre@db:5432/sre
      SRE_REMEDIATION_TARGETS: ${SRE_REMEDIATION_TARGETS:-[]}
      <<: *traces
    env_file: [.lab.executor.env]
    networks: [default, kind]
    volumes:
      - ./.lab-ca.crt:/run/lab/ca.crt:ro
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}

networks:
  kind:
    external: true
