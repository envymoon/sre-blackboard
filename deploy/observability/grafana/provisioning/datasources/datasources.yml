apiVersion: 1
datasources:
  - name: Prometheus
    uid: sre-prometheus
    type: prometheus
    access: proxy
    url: ${SRE_PROMETHEUS_QUERY_URL}
    isDefault: true
    jsonData:
      # A histogram exemplar's trace id opens the trace in Jaeger.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: sre-jaeger
  - name: Jaeger
    uid: sre-jaeger
    type: jaeger
    access: proxy
    url: ${SRE_JAEGER_QUERY_URL}
